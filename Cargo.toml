[package]
name = "home-menu"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.14", features = ["postgres", "chrono"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha256 = "1.6.0"
tokio = { version = "1.54.1", features = ["full"] }
vizia = {git = "https://github.com/vizia/vizia"}
